name: Build for ARM64
on: [push]

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false

    # The pipewire pkg-config exposes -fno-strict-overflow as of PipeWire 1.6.0,
    # which cgo rejects unless it is explicitly allowed. Inert on 24.04, which
    # predates that; here so bumping the runner pin does not break the build.
    env:
      CGO_CFLAGS_ALLOW: -fno-strict-overflow

    steps:
    - uses: actions/checkout@v6

    - name: Set env
      run: if grep -Fxq "devel" version.txt;then echo "GO2TV_VERSION=$(cat version.txt)";else echo "GO2TV_VERSION=v$(cat version.txt)";fi  >> $GITHUB_ENV
   
    - uses: actions/setup-go@v6
      with:
        go-version-file: go.mod

    - name: Get dependencies
      run: sudo apt update && sudo apt install -y xorg-dev libwayland-dev libxkbcommon-dev libegl-dev libpipewire-0.3-dev pkg-config

    - name: Package (Linux)
      run: go build -tags migrated_fynedo -ldflags "-s -w" -o go2tv ./cmd/go2tv

    - uses: actions/upload-artifact@v6
      with:
        name: go2tv_${{ env.GO2TV_VERSION }}_linux_arm64
        path: |
          LICENSE
          README.md
          go2tv
        retention-days: 2
