name: Build AppImage
on: [push]

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false

    # The pipewire pkg-config exposes -fno-strict-overflow as of PipeWire 1.6.0,
    # which cgo rejects unless it is explicitly allowed. Inert on 24.04, which
    # predates that; here so bumping the runner pin does not break the build.
    env:
      CGO_CFLAGS_ALLOW: -fno-strict-overflow

    steps:
    - uses: actions/checkout@v6

    - name: Set env
      run: if grep -Fxq "devel" version.txt;then echo "GO2TV_VERSION=$(cat version.txt)";else echo "GO2TV_VERSION=v$(cat version.txt)";fi  >> $GITHUB_ENV

    - uses: actions/setup-go@v6
      with:
        go-version-file: go.mod

    - name: Get dependencies
      run: sudo apt update && sudo apt install -y xorg-dev libwayland-dev libxkbcommon-dev libegl-dev libpipewire-0.3-dev pkg-config curl wget tar xz-utils libfuse2t64 zsync

    - name: Package (AppImage)
      env:
        APPIMAGE_EXTRACT_AND_RUN: 1
      run: |
        set -euo pipefail
        appimage_name="go2tv_${GO2TV_VERSION}_linux_amd64_ffmpeg.AppImage"
        update_info=""
        if [[ "$GO2TV_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          update_info='gh-releases-zsync|alexballas|go2tv|latest|go2tv_*_linux_amd64_ffmpeg.AppImage.zsync'
        fi
        make appimage-ffmpeg APPIMAGE_FFMPEG_MODE=download \
          "APPIMAGE_OUT=build/$appimage_name" \
          "APPIMAGE_UPDATE_INFO=$update_info"
        test -s "build/$appimage_name"
        if [ -n "$update_info" ]; then
          test -s "build/$appimage_name.zsync"
          actual_update_info="$("build/$appimage_name" --appimage-updateinformation)"
          if [ "$actual_update_info" != "$update_info" ]; then
            echo "AppImage update information mismatch: $actual_update_info"
            exit 1
          fi
          zsync_url="$(sed -n 's/^URL: //p;/^$/q' "build/$appimage_name.zsync")"
          if [ "$zsync_url" != "$appimage_name" ]; then
            echo "zsync URL mismatch: $zsync_url"
            exit 1
          fi
          mv "build/$appimage_name.zsync" "$appimage_name.zsync"
        fi
        mv "build/$appimage_name" "$appimage_name"
        chmod +x "$appimage_name"

    - uses: actions/upload-artifact@v6
      with:
        name: go2tv_${{ env.GO2TV_VERSION }}_linux_amd64_ffmpeg.AppImage
        path: |
          go2tv_${{ env.GO2TV_VERSION }}_linux_amd64_ffmpeg.AppImage
          go2tv_${{ env.GO2TV_VERSION }}_linux_amd64_ffmpeg.AppImage.zsync
        if-no-files-found: error
        retention-days: 2
