name: Build for MacOS Intel
on: [push]

jobs:
  build:
    runs-on: macos-latest
    strategy:
      fail-fast: false

    steps:
    - uses: actions/checkout@v6

    - name: Set env
      run: if grep -Fxq "devel" version.txt;then echo "GO2TV_VERSION=$(cat version.txt)";else echo "GO2TV_VERSION=v$(cat version.txt)";fi  >> $GITHUB_ENV

    - uses: actions/setup-go@v6
      with:
        go-version-file: go.mod

    - name: Install refyne
      run: go install github.com/alexballas/refyne/v2/cmd/fyne@latest

    - name: Package (macOS)
      run: |
        APP_BUILD="$(make print-app-build)"
        cd cmd/go2tv
        CGO_CFLAGS="-mmacosx-version-min=12.3" CGO_LDFLAGS="-mmacosx-version-min=12.3" MACOSX_DEPLOYMENT_TARGET=12.3 GOARCH=amd64 fyne package --release --os darwin --app-version "${GO2TV_VERSION#v}" --app-build "$APP_BUILD" --icon ../../assets/go2tv-icon.png
        mv go2tv.app ../../

    - uses: actions/upload-artifact@v6
      with:
        name: go2tv_${{ env.GO2TV_VERSION }}_macOS_amd64
        path: |
          LICENSE
          README.md
          go2tv.app/
        retention-days: 2
