<body>
<main>
  <header class="app-header">
    <div class="brand"><svg class="brand-mark" viewBox="1580 -40 1880 2040" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="g2tv-frame" gradientUnits="userSpaceOnUse" x1="1616" y1="975" x2="3384" y2="975"><stop offset="0" stop-color="#ff00ff"/><stop offset="1" stop-color="#00e2e2"/></linearGradient><linearGradient id="g2tv-dot1" gradientUnits="userSpaceOnUse" x1="2229" y1="811" x2="2567" y2="811"><stop offset="0" stop-color="#ff00ff"/><stop offset="1" stop-color="#00c0c0"/></linearGradient><linearGradient id="g2tv-dot2" gradientUnits="userSpaceOnUse" x1="2405" y1="1144" x2="2658" y2="1144"><stop offset="0" stop-color="#ff00ff"/><stop offset="1" stop-color="#00c0c0"/></linearGradient><linearGradient id="g2tv-dot3" gradientUnits="userSpaceOnUse" x1="2549" y1="1399" x2="2718" y2="1399"><stop offset="0" stop-color="#ff00ff"/><stop offset="1" stop-color="#00c0c0"/></linearGradient></defs><path fill="url(#g2tv-dot1)" opacity=".7" d="m 2335.5,653.5 c -86.7,34.6 -128.9,132.9 -94.3,219.6 34.6,86.7 132.9,128.9 219.6,94.3 86.7,-34.6 128.9,-132.9 94.3,-219.6 -34.6,-86.6 -132.9,-128.9 -219.6,-94.3 z"/><path fill="url(#g2tv-dot2)" opacity=".7" d="m 2484.3,1026.4 c -65,26 -96.7,99.7 -70.7,164.7 26,65 99.7,96.7 164.7,70.7 65,-26 96.7,-99.7 70.7,-164.7 -25.9,-65 -99.6,-96.7 -164.7,-70.7 z"/><path fill="url(#g2tv-dot3)" opacity=".7" d="m 2601.8,1320.7 c -43.3,17.3 -64.5,66.5 -47.2,109.8 17.3,43.3 66.5,64.5 109.8,47.2 43.3,-17.3 64.5,-66.5 47.2,-109.8 -17.3,-43.3 -66.4,-64.5 -109.8,-47.2 z"/><path fill="url(#g2tv-frame)" d="m 2564,209.8 -258.1,103 91.8,-213.7 c 15.5,-36 -1.2,-77.8 -37.2,-93.3 -36.1,-15.5 -77.8,1.2 -93.3,37.2 l -92.8,216 -216,-92.8 c -36.1,-15.5 -77.8,1.2 -93.3,37.2 -15.5,36 1.2,77.8 37.2,93.3 L 2116,388.5 1864.3,489 c -202,80.6 -300.7,310.6 -220.1,512.6 l 279.3,699.7 c 80.6,202 310.6,300.7 512.6,220.1 l 699.7,-279.3 c 202,-80.6 300.7,-310.6 220.1,-512.6 L 3076.6,429.8 C 2995.9,227.9 2766,129.2 2564,209.8 Z m 659.9,972.5 c 51.6,129.2 -11.6,276.4 -140.8,327.9 l -699.7,279.3 c -129.2,51.6 -276.4,-11.6 -327.9,-140.8 L 1776.1,949 c -51.6,-129.2 11.6,-276.4 140.8,-327.9 l 699.7,-279.3 c 129.2,-51.6 276.4,11.6 327.9,140.8 z"/></svg><div><h1>Go2TV</h1><p>Your media, on the big screen</p></div></div>
    <div class="connection" aria-live="polite"><i id="connection-dot" aria-hidden="true"></i><span id="status">Connecting…</span><span id="pending"></span></div>
  </header>

  <div class="top-grid">
    <section class="devices-card">
      <div class="section-heading"><div><span>Renderer</span><h2>Choose a device</h2></div></div>
      <p class="section-help">Select where media should play.</p>
      <div class="device-controls"><div id="device-picker" class="device-picker"><button id="device-trigger" class="device-trigger" type="button" aria-haspopup="listbox" aria-controls="devices" aria-expanded="false"></button><div id="devices" class="device-list" role="listbox" aria-label="Renderer" hidden></div></div><button id="refresh" type="button">Refresh</button></div>
    </section>

    <section class="player-card">
      <div class="artwork-shell"><img id="artwork" alt="Current media artwork" hidden><div id="artwork-placeholder" aria-hidden="true">♪</div></div>
      <div class="player-body">
        <div class="player-heading"><div class="now-playing"><span>Now playing</span><h2 id="now-playing-title">Nothing selected</h2></div><strong id="playback-state">Stopped</strong></div>
        <div class="timeline"><p id="time">0:00 / 0:00</p><input id="seek" type="range" min="0" max="0" value="0" aria-label="Seek" disabled></div>
        <div class="transport-row">
          <div class="controls"><button id="play-toggle" type="button" data-command="player.play" class="primary-control">Play</button><button id="stop-button" type="button" data-command="player.stop">Stop</button></div>
          <div class="volume-control" role="group" aria-label="Volume controls"><span>Volume</span><button id="volume-down" type="button" aria-label="Volume down">−</button><button id="volume-up" type="button" aria-label="Volume up">+</button><button id="mute" type="button" aria-pressed="false">Mute</button></div>
        </div>
        <div class="player-options"><label><input id="transcode" type="checkbox"> Transcode next load</label></div>
      </div>
    </section>
  </div>

  <div class="content-grid">
    <section class="library-card">
      <div class="section-heading library-heading"><div><span>Media browser</span><h2>Library</h2></div><select id="roots" aria-label="Media root"></select></div>
      <div class="selection-status"><div><span class="status-label">Media</span><strong id="media-selected">No media selected</strong></div><div><span class="status-label">Subtitles</span><div class="selection-value"><span id="subtitle-selected">None</span><button id="subtitle-clear" type="button" hidden>Clear</button></div></div></div>
      <div class="browser-toolbar"><div id="breadcrumbs" class="breadcrumbs" aria-label="Current folder"></div><input id="library-filter" type="search" placeholder="Filter this folder" aria-label="Filter this folder"></div>
      <ul id="library" class="library-list"></ul>
    </section>

    <aside class="side-stack">
      <section class="queue-card">
        <div class="section-heading"><div><span>Up next</span><h2>Queue <small id="queue-count">0</small></h2></div></div>
        <ul id="queue"></ul>
      </section>
      <section class="policy-card">
        <div class="section-heading"><div><span>Behavior</span><h2>Playback</h2></div></div>
        <div class="policies">
          <label><input id="loop" type="checkbox"><span><strong>Loop selected</strong><small>Replay the current item</small></span></label>
          <label><input id="autoplay" type="checkbox"><span><strong>Autoplay next</strong><small>Continue through the queue</small></span></label>
          <label><input id="same-type" type="checkbox"><span><strong>Same type only</strong><small>Skip unlike media</small></span></label>
          <label><input id="gapless" type="checkbox"><span><strong>Gapless</strong><small>DLNA renderers only</small></span></label>
          <label class="image-duration"><span><strong>Image duration</strong><small>Seconds before advancing</small></span><input id="image-duration" type="number" min="0" max="86400" value="10"></label>
        </div>
      </section>
    </aside>
  </div>
  <aside id="toast" aria-live="polite" aria-label="Notifications"></aside>
</main>
<dialog id="artwork-modal" aria-labelledby="artwork-modal-title">
  <div class="artwork-modal-card">
    <button id="artwork-modal-close" type="button" aria-label="Close artwork">×</button>
    <img id="artwork-modal-image" alt="" hidden>
    <p id="artwork-modal-title"></p>
  </div>
</dialog>
<script type="module" src="/assets/__JS__"></script>
</body>
</html>
