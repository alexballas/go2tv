    <main>
      <header class="app-header">
        <div class="brand">
          <svg
            class="brand-mark"

            aria-hidden="true"
            xmlns="http://www.w3.org/2000/svg"
          >

                y2="975"
              >
                <stop offset="0" stop-color="#ff00ff" />
                <stop offset="1" stop-color="#00e2e2" />
              </linearGradient>
              <linearGradient
                id="g2tv-dot1"

              <linearGradient

          <div>
            <h1>Go2TV</h1>
            <p>Media Casting Made Easy</p>
          </div>
        </div>
        <div class="header-tools">
          <div class="connection" aria-live="polite">
            <i id="connection-dot" aria-hidden="true"></i
            ><span id="status">Connecting…</span><span id="pending"></span>
          </div>
          <button
            id="theme-toggle"
            type="button"
            class="theme-toggle"
            data-mode="auto"
            title="Theme: Auto"
            aria-label="Theme: Auto"
          ></button>
        </div>
      </header>

      <div class="workspace-grid">
        <div class="primary-column">
          <section class="player-card">
            <div class="artwork-shell">
              <img id="artwork" alt="Current media artwork" hidden />
              <div id="artwork-placeholder" aria-hidden="true">♪</div>
            </div>
            <div class="player-body">
              <div class="player-heading">
                <div class="now-playing">
                  <span>Now playing</span>
                  <h2 id="now-playing-title">Nothing playing</h2>
                </div>
                <strong id="playback-state">Stopped</strong>
              </div>
              <div class="timeline">
                <p id="time">0:00 / 0:00</p>
                <input
                  id="seek"
                  type="range"
                  min="0"
                  max="0"
                  value="0"
                  aria-label="Seek"
                  disabled
                />
              </div>
              <div class="transport-row">
                <div class="controls">
                  <button
                    id="play-toggle"
                    type="button"
                    data-command="player.play"
                    class="primary-control"
                    aria-label="Play"
                    title="Play"
                  >
                    <svg class="action-icon" aria-hidden="true">
                      <use href="#icon-play"></use>
                    </svg></button
                  ><button
                    id="stop-button"
                    type="button"
                    data-command="player.stop"
                    aria-label="Stop"
                    title="Stop"
                  >
                    <svg class="action-icon" aria-hidden="true">
                      <use href="#icon-square"></use>
                    </svg>
                  </button>
                </div>
                <div class="player-options">
                  <label
                    ><input id="transcode" type="checkbox" /> Transcode next
                    load</label
                  >
                </div>
                <div
                  class="volume-control"
                  role="group"
                  aria-label="Volume controls"
                >
                  <span>Volume</span
                  ><button
                    id="volume-down"
                    type="button"
                    aria-label="Volume down"
                    title="Volume down"
                  >
                    <svg class="action-icon" aria-hidden="true">
                      <use href="#icon-volume-1"></use>
                    </svg></button
                  ><button
                    id="volume-up"
                    type="button"
                    aria-label="Volume up"
                    title="Volume up"
                  >
                    <svg class="action-icon" aria-hidden="true">
                      <use href="#icon-volume-2"></use>
                    </svg></button
                  ><button
                    id="mute"
                    type="button"
                    aria-label="Mute"
                    title="Mute"
                    aria-pressed="false"
                  >
                    <svg class="action-icon" aria-hidden="true">
                      <use href="#icon-volume-x"></use>
                    </svg>
                  </button>
                </div>
              </div>
            </div>
          </section>

          <section class="library-card">
            <div class="section-heading library-heading">
              <div>
                <span>Media browser</span>
                <h2>Library</h2>
              </div>
              <div class="library-tools">
                <input
                  id="library-filter"
                  type="search"
                  placeholder="Filter this folder"
                  aria-label="Filter this folder"
                /><select id="roots" aria-label="Media root"></select>
              </div>
            </div>
            <div class="selection-status">
              <div>
                <span class="status-label">Media</span
                ><strong id="media-selected">No media</strong>
              </div>
              <div>
                <span class="status-label">Subtitles</span>
                <div class="selection-value">
                  <span id="subtitle-selected">None</span
                  ><button id="subtitle-clear" type="button" hidden>
                    Clear
                  </button>
                </div>
              </div>
            </div>
            <div class="browser-toolbar">
              <div
                id="breadcrumbs"
                class="breadcrumbs"
                aria-label="Current folder"
              ></div>
            </div>
            <ul id="library" class="library-list"></ul>
          </section>
        </div>

        <aside class="side-column">
          <section class="devices-card">
            <div class="section-heading device-heading">
              <div>
                <span>Device</span>
                <h2>Renderer</h2>
              </div>
              <button
                id="refresh"
                type="button"
                class="icon-action"
                aria-label="Refresh devices"
                title="Refresh devices"
              >
                <svg class="action-icon" aria-hidden="true">
                  <use href="#icon-refresh-cw"></use>
                </svg>
              </button>
            </div>
            <div class="device-controls">
              <div id="device-picker" class="device-picker">
                <button
                  id="device-trigger"
                  class="device-trigger"
                  type="button"
                  aria-haspopup="listbox"
                  aria-controls="devices"
                  aria-expanded="false"
                ></button>
                <div
                  id="devices"
                  class="device-list"
                  role="listbox"
                  aria-label="Renderer"
                  hidden
                ></div>
              </div>
            </div>
          </section>

          <section class="queue-card">
            <div class="section-heading">
              <div>
                <span>Up next</span>
                <h2>Playlist <small id="queue-count">0</small></h2>
              </div>
              <button
                id="queue-clear"
                type="button"
                class="icon-action"
                aria-label="Clear playlist"
                title="Clear playlist"
                disabled
              >
                <svg class="action-icon" aria-hidden="true">
                  <use href="#icon-list-x"></use>
                </svg>
              </button>
            </div>
            <ul id="queue"></ul>
          </section>

          <section class="policy-card">
            <div class="section-heading">
              <div>
                <span>Behavior</span>
                <h2>Playback</h2>
              </div>
            </div>
            <div class="policies">
              <label
                ><input id="loop" type="checkbox" /><span
                  ><strong>Loop current</strong
                  ><small>Replay the current item</small></span
                ></label
              >
              <label
                ><input id="autoplay" type="checkbox" /><span
                  ><strong>Autoplay next</strong
                  ><small>Continue through the playlist</small></span
                ></label
              >
              <label
                ><input id="same-type" type="checkbox" /><span
                  ><strong>Same type only</strong
                  ><small>Skip unlike media</small></span
                ></label
              >
              <label
                ><input id="gapless" type="checkbox" /><span
                  ><strong>Gapless</strong
                  ><small>Queue next URI on DLNA renderers</small></span
                ></label
              >
              <label class="image-duration"
                ><span
                  ><strong>Image duration</strong
                  ><small>0 disables; otherwise 5–300 seconds</small></span
                ><input
                  id="image-duration"
                  type="number"
                  min="0"
                  max="300"
                  step="1"
                  value="10"
              /></label>
            </div>
          </section>
        </aside>
      </div>
      <aside id="toast" aria-live="polite" aria-label="Notifications"></aside>
    </main>
    <button
      id="back-to-top"
      type="button"
      aria-label="Back to top"
      aria-hidden="true"
      title="Back to top"
      tabindex="-1"
      data-visible="false"
    >
      <svg class="action-icon" aria-hidden="true">
        <use href="#icon-arrow-up"></use>
      </svg>
    </button>
    <dialog id="artwork-modal" aria-labelledby="artwork-modal-title">
      <div class="artwork-modal-card">
        <button
          id="artwork-modal-close"
          type="button"
          aria-label="Close artwork"
        >
          ×
        </button>
        <img id="artwork-modal-image" alt="" hidden />
        <p id="artwork-modal-title"></p>
      </div>
    </dialog>
    <script type="module" src="/assets/__JS__"></script>
  </body>
</html>
