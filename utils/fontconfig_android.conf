<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <dir>/system/fonts</dir>
  <dir>/product/fonts</dir>
  <dir>/vendor/fonts</dir>
  <dir>/system_ext/fonts</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>
  <alias><family>Arial</family><prefer><family>Roboto</family><family>Noto Sans</family></prefer></alias>
  <alias><family>Helvetica</family><prefer><family>Roboto</family><family>Noto Sans</family></prefer></alias>
  <alias><family>sans-serif</family><prefer><family>Roboto</family><family>Noto Sans</family></prefer></alias>
  <alias><family>Times New Roman</family><prefer><family>Noto Serif</family></prefer></alias>
  <alias><family>serif</family><prefer><family>Noto Serif</family></prefer></alias>
  <alias><family>Courier New</family><prefer><family>Droid Sans Mono</family><family>Noto Sans Mono</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>Droid Sans Mono</family><family>Noto Sans Mono</family></prefer></alias>
</fontconfig>
